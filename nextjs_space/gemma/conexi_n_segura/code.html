<style>

<body class="bg-background text-on-background font-body-md text-body-md min-h-screen flex flex-col items-center justify-center p-container-margin overflow-hidden relative bg-mesh">

<!-- Main Content Canvas -->
<main class="w-full max-w-[420px] relative z-10">
<!-- Header / Logo -->

<div class="w-24 h-24 mb-8 relative">
<div class="absolute inset-0 bg-primary/20 rounded-full blur-xl scale-125"></div>

</div>
</div>
<img alt="Volkern Logo" class="h-8 mb-4 opacity-90" data-alt="The sleek and professional Volkern OS logo, presented in a crisp white and subtle grey palette to stand out against the dark indigo background. The typography is modern and minimalist, conveying reliability, high-tech engineering, and corporate elegance suitable for an AI-driven digital environment." src="https://lh3.googleusercontent.com/aida/AP1WRLumx3tHLmFbBm55yhC16H2MOhTAJx-3EtgeeV6OoBezJWkdXZVcVOkiN4JYx17gEwJA4XBdS-gjfmMSC3zVA00A7VqSEgk2ZfTiCMU-8v8kVCrbWXXHqRctwroAbtFKFpl7VzOH5rH-dS4jCzROMiKtf7lnME5aukqmZfAEI7kdiIjfyQxugiF8sw9yNMw6yCOfDXa-M208Tc40s2Rwa4H3XHayjOxxdyGJ-1ryytogndj-QHFrNKd96Oou"/>
<h1 class="font-headline-md-mobile text-headline-md-mobile md:font-headline-md md:text-headline-md text-on-surface tracking-tight">
                Conectar a Volkern OS
            </h1>
<p class="text-on-surface-variant text-body-md mt-2 max-w-[320px]">
                Accede a tu instancia privada de inteligencia artificial.
            </p>
</div>
<!-- Connection Card -->
<div class="glass-panel rounded-xl p-8 shadow-2xl space-y-6">
<!-- URL Field -->
<div class="space-y-2">
<label class="font-label-sm text-label-sm text-outline block ml-1" for="server_url">URL DEL SERVIDOR</label>
<div class="relative group">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">dns</span>
</div>
<input class="w-full bg-surface-container-low border border-outline-variant text-on-surface rounded-lg py-3.5 pl-12 pr-4 focus:ring-2 focus:ring-primary/30 focus:border-primary transition-all outline-none font-body-md placeholder:text-outline/50" id="server_url" placeholder="https://instancia.volkern.app" type="text"/>
</div>
</div>
<!-- API Key Field -->
<div class="space-y-2">
<label class="font-label-sm text-label-sm text-outline block ml-1" for="api_key">API KEY</label>
<div class="relative group">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-primary transition-colors">

<button class="absolute inset-y-0 right-4 flex items-center text-on-surface-variant hover:text-primary transition-colors active:scale-90" onclick="togglePassword()" type="button">

</button>
</div>
</div>

<span class="font-headline-md-mobile text-headline-md-mobile">Conectar</span>

</button>

<a class="text-label-sm font-label-sm text-tertiary hover:opacity-80 transition-opacity flex items-center gap-1" href="#">
<span class="material-symbols-outlined text-[14px]">help</span> Soporte

<div class="h-[1px] w-8 bg-outline/20"></div>

<p class="text-[11px] text-outline/40 mt-2 max-w-[280px] mx-auto leading-normal">

            </p>

<div class="absolute bottom-10 left-10 w-32 h-32 rounded-full border border-primary/10 animate-bounce duration-[8000ms] opacity-20 hidden md:block"></div>
<div class="absolute top-20 right-20 w-48 h-48 rounded-full border border-secondary/10 animate-pulse duration-[12000ms] opacity-10 hidden md:block"></div>
<script>
        function togglePassword() {
            const input = document.getElementById('api_key');
            const icon = document.getElementById('eye_icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerText = 'visibility_off';
            } else {
                input.type = 'password';
                icon.innerText = 'visibility';
            }
        }

        // Simple button loading micro-interaction
        const btn = document.querySelector('button.bg-gradient-to-r');
        btn.addEventListener('click', function() {
            const originalContent = this.innerHTML;
            this.disabled = true;
            this.classList.add('opacity-80', 'cursor-not-allowed');
            this.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> <span class="font-headline-md-mobile text-headline-md-mobile">Iniciando...</span>';
            
            setTimeout(() => {
                this.innerHTML = originalContent;
                this.disabled = false;
                this.classList.remove('opacity-80', 'cursor-not-allowed');
            }, 2000);
        });
    </script>
</body></html>
