# ═══════════════════════════════════════════════════════════════
# Volkern ERP — Docker Compose
# Uso:   docker compose up -d
#        docker compose logs -f app
# ═══════════════════════════════════════════════════════════════

version: "3.8"

services:
  # ─── PostgreSQL ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: volkern-postgres
    restart: unless-stopped
    # La BD solo se publica en loopback: un "5432:5432" pelado la deja
    # escuchando en 0.0.0.0 y, en cualquier máquina compartida o VPS, eso es
    # la BD entera a un intento de adivinar la contraseña de distancia.
    # Nadie fuera del host necesita el puerto: la app entra por la red interna
    # (postgres:5432) y el operador por `docker exec`. Detalle y evidencia en
    # docs/VPS-SEGURIDAD-PUERTOS.md.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-volkern}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-volkern_secret}
      POSTGRES_DB: ${POSTGRES_DB:-volkern}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-volkern} -d ${POSTGRES_DB:-volkern}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── App Volkern ───────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: volkern-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-volkern}:${POSTGRES_PASSWORD:-volkern_secret}@postgres:5432/${POSTGRES_DB:-volkern}
      CHROME_PATH: /usr/bin/chromium
      ALLOW_DB_PUSH: ${ALLOW_DB_PUSH:-false}
      SEED_ON_START: ${SEED_ON_START:-false}
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get({hostname:'localhost',port:3000,path:'/',timeout:5000},(r)=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ─── Traccar GPS Server (ingestión de trackers) ────────────
  # Documentación: docs/GPS-TRACKER-SETUP.md
  traccar:
    image: traccar/traccar:latest
    container_name: volkern-traccar
    restart: unless-stopped
    ports:
      # Puerto web (admin dashboard)
      - "8082:8082"
      # Puertos para dispositivos GPS (protocolos binarios)
      - "5001:5001"   # GT06 / Concox
      - "5002:5002"   # H02
      - "5003:5003"   # Teltonika
      - "5005:5005"   # Queclink
      - "5008:5008"   # Watch
      - "5013:5013"   # Ruptela
      - "5023:5023"   # OsmAnd (HTTP)
      - "5055:5055"   # Traccar protocol (HTTP)
    environment:
      CONFIG_USE_ENVIRONMENT_VARIABLES: "true"
      LOGGER_LEVEL: "info"
      DATABASE_DRIVER: "org.postgresql.Driver"
      DATABASE_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB:-volkern}?user=${POSTGRES_USER:-volkern}&password=${POSTGRES_PASSWORD:-volkern_secret}"
    volumes:
      - traccar-logs:/opt/traccar/logs
    depends_on:
      postgres:
        condition: service_healthy

  # ─── Bridge Traccar → Volkern (cron-based) ─────────────────
  # Descomenta para activar el reenvío automático de posiciones GPS a Volkern
  # traccar-bridge:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: volkern-traccar-bridge
  #   restart: unless-stopped
  #   entrypoint: ["npx", "tsx", "scripts/traccar-bridge.ts", "--daemon", "--interval", "30"]
  #   environment:
  #     TRACCAR_URL: "http://traccar:8082"
  #     TRACCAR_USER: "admin"
  #     TRACCAR_PASS: "admin"
  #     VOLKERN_URL: "http://app:3000"
  #   volumes:
  #     - ./traccar-device-mapping.json:/app/traccar-device-mapping.json:ro
  #   depends_on:
  #     traccar:
  #       condition: service_started
  #     app:
  #       condition: service_healthy

  # ─── Apprise (notificaciones) ──────────────────────────────
  apprise:
    extends:
      file: docker-compose.apprise.yml
      service: apprise-api

  # ─── Caddy (reverse proxy, SSL automático) ─────────────────
  # Maneja dominios personalizados y SSL con Let's Encrypt.
  # Descomenta para exponer en puertos 80/443 en vez de 3000.
  # caddy:
  #   image: caddy:2-alpine
  #   container_name: volkern-caddy
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy-data:/data
  #     - caddy-config:/config
  #   depends_on:
  #     app:
  #       condition: service_healthy

volumes:
  postgres-data:
    driver: local
  traccar-logs:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local
  # `extends` no hereda el bloque `volumes` del otro fichero: sin esta
  # declaración Docker rechaza el proyecto entero y no arranca ni la BD.
  apprise-config:
    driver: local

networks:
  default:
    name: volkern-network
