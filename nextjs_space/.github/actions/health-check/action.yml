# ═══════════════════════════════════════════════════════════════
# Volkern ERP — Infrastructure & API Health Check
#
# Composite action reusable entre jobs. Verifica:
#   1. Prisma CLI disponible y versión
#   2. Conexión a PostgreSQL (SELECT 1)
#   3. Conexión a Redis (PING via ioredis)
#   4. Conexión a colas BullMQ del proyecto:
#      - execution-queue (automatizaciones / workflows)
#      - aeat-shipment (envíos fiscales AEAT Veri*factu)
#      - marketing-social-posts (publicaciones en redes)
#      - marketing-campaign-emails (campañas de email)
#      - marketing-lead-nurturing (nutrición de leads)
#   5. Conexión a S3/R2 (HeadBucket via @aws-sdk/client-s3)
#   6. Conexión a AI providers — OpenRouter + OpenAI (auth key validation)
#   7. API health endpoint (GET /api/health) — arranca servidor local
#   8. Script npm requerido existe en package.json
#
# Uso:
#   - name: Health check
#     uses: ./.github/actions/health-check
#     with:
#       npm-script: test:e2e
#       api-port: 3098
#     env:
#       DATABASE_URL: ${{ secrets.DATABASE_URL }}
# ═══════════════════════════════════════════════════════════════

name: Infrastructure & API Health Check
description: Verify Prisma CLI, PostgreSQL, Redis, BullMQ queues, S3/R2, AI providers (OpenRouter, OpenAI), API health, and required npm script

inputs:
  npm-script:
    description: "Name of the npm script to verify (e.g., 'test', 'test:e2e')"
    required: true
    default: "test"
  api-port:
    description: "Port for the API health check server (default: 3098 — avoids conflict with E2E on 3099)"
    required: false
    default: "3098"

runs:
  using: "composite"
  steps:
    - name: Check Prisma version
      shell: bash
      run: |
        echo "=== Prisma version ==="
        npx prisma --version 2>&1 | head -3

    - name: Check database connection
      shell: bash
      run: |
        echo "=== Database connection ==="
        npx prisma db execute --stdin <<< "SELECT 1 AS ok" 2>&1 | head -3

    - name: Check Redis connection
      shell: bash
      run: |
        echo "=== Redis connection ==="
        node -e "
        const Redis = require('ioredis');
        const url = process.env.REDIS_URL || 'redis://localhost:6379';
        const c = new Redis(url, { lazyConnect: true, maxRetriesPerRequest: 1, retryStrategy: () => null, maxLoadingRetryTime: 1000 });
        c.ping().then(r => { console.log('Redis: connected (' + r + ')'); c.disconnect(); process.exit(0); }).catch(e => { console.log('Redis: not available (' + e.message + ')'); c.disconnect(); process.exit(0); });
        "

    - name: Check BullMQ — execution-queue
      shell: bash
      run: |
        echo "=== BullMQ: execution-queue ==="
        node -e "
        const { Queue } = require('bullmq');
        const url = process.env.REDIS_URL || 'redis://localhost:6379';
        async function check() {
          const q = new Queue('execution-queue', {
            connection: { url, maxRetriesPerRequest: 1, retryStrategy: () => null },
          });
          try {
            const c = await q.getJobCounts();
            console.log('OK — waiting:' + c.waiting + ' active:' + c.active + ' failed:' + c.failed);
          } catch (e) {
            console.log('FAIL — ' + e.message);
          } finally {
            try { await q.close(); } catch {}
            process.exit(0);
          }
        }
        check();
        "

