# ═══════════════════════════════════════════════════════════════
# Volkern ERP — Google Calendar Webhook Renewal (Cron Backup)
# Renueva los canales webhook de Google Calendar cada 12 horas.
#
# Este workflow es el ÚNICO disparador de este cron: no está en el crontab
# del VPS (deploy-vps/cron.sh), que solo ejecuta los 4 jobs diarios.
# Ejecuta GET /api/cron/google-calendar-renew con Bearer.
#
# Configurar en GitHub:
#   Settings → Secrets and variables → Actions → New repository secret
#   - CRON_SECRET:  el mismo valor que en /root/volkern-erp/.env del VPS
#   - APP_URL:      dominio público del ERP — https://erp.dimension.expert
#                   ⚠️ COMPROBAR: si sigue apuntando a un host *.vercel.app,
#                   este cron lleva fallando en silencio cada 12 h.
# ═══════════════════════════════════════════════════════════════

name: Google Calendar Webhook Renewal

on:
  # Cada 12 horas: 00:00 y 12:00 UTC
  schedule:
    - cron: "0 */12 * * *"

  # Permitir ejecución manual desde GitHub Actions UI
  workflow_dispatch:

jobs:
  renew-webhooks:
    name: Renew webhook channels
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Call renew endpoint
        run: |
          echo "🔄 Renovando canales webhook de Google Calendar..."
          echo "   Target: ${{ secrets.APP_URL }}/api/cron/google-calendar-renew"
          echo "   Time:   $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/google-calendar-renew" 2>&1)

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "   HTTP Status: $HTTP_CODE"
          echo "   Response:    $BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Error: HTTP $HTTP_CODE"
            exit 1
          fi

          echo "✅ Canales renovados exitosamente"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Falló la renovación de canales webhook de Google Calendar"
          echo "   Revise los logs en: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
