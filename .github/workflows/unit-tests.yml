name: Unit Tests (Vitest)

on:
  push:
    branches: [master]
    paths-ignore:
      - 'app-movil/**'
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [master]
    paths-ignore:
      - 'app-movil/**'
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: nextjs_space

jobs:
  test:
    name: Vitest
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: volkern_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nextjs_space/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify Prisma CLI
        run: npx prisma --version
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/volkern_test

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/volkern_test

      - name: Push Prisma schema
        run: npx prisma db push --accept-data-loss
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/volkern_test

      - name: Run multi-tenancy migration (creates default tenant & roles)
        run: npx tsx scripts/migrate-multi-tenancy.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/volkern_test

      - name: Seed database (tenant, roles, test users)
        run: npx tsx scripts/seed.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/volkern_test

      - name: Backup .env files to prevent conflicts with CI env vars
        run: |
          for f in .env .env.local .env.production .env.production.local; do
            if [ -f "$f" ]; then
              mv "$f" "$f.ci-backup"
              echo "Backed up $f → $f.ci-backup"
            fi
          done

      - name: Run integration & deploy guards (scopes, webhooks, UI stubs, deploy scripts, clasificador, dinero, base de datos, permisos de Hospitality)
        # Guardias de integración, ejecutadas explícitamente (y antes de la suite
        # completa) para que corran en cada push aunque algún día se filtre la
        # invocación principal de vitest:
        #   - api-key-scopes: todo scope exigido por un endpoint existe en AVAILABLE_SCOPES
        #   - outgoing-webhook-events: todo evento saliente disparado/registrado existe
        #     en getAvailableEvents() y el catálogo coincide con el union type WebhookEvent
        #   - client-catalog-stubs: páginas 'use client' no pueden redeclarar catálogos
        #     con stubs vacíos (getAvailableX = () => []) que oculten opciones de la UI
        #   - deploy-docker-templates: las plantillas `docker ... --format` de los scripts de
        #     despliegue no pueden usar campos retirados (p. ej. `.Status` en `service ps`,
        #     eliminado en Docker 26) que abortaban el pipeline en silencio
        #   - deploy-scripts-syntax: todo script de deploy-vps/ y scripts/ pasa `bash -n`
        #     (y shellcheck con severidad error si está disponible) antes de llegar al VPS
        #   - intent-determinista: las frases que deben resolverse SIN LLM se
        #     comprueban contra el detector determinista (no contra classify()):
        #     en CI no hay claves y caían a consulta_general sin que se notara
        #   - moneda-plataforma: `lib/moneda.ts` es el único archivo que puede
        #     contener un código de divisa o un formato de dinero; el resto escribe
        #     los importes con `formatearImporte` (Hospitality ya sin deuda, el resto
        #     con inventario que solo puede bajar)
        #   - guardia-base-datos-produccion: la suite se detiene si DATABASE_URL apunta
        #     a la base de producción (el 11-ago-2026 una tanda de tests dejó 9 tenants
        #     y 14 claves de prueba dentro de la base real)
        #   - hospitality-permissions: todo método de /api/hospitality exige permiso por
        #     acción del rol (§27), la capacidad exigida existe en el catálogo y el editor
        #     de roles puede concederla (un endpoint sin permiso abre la puerta a cualquiera
        #     del tenant sin que nada falle)
        #   - hospitality-ui-permissions: la otra mitad de lo mismo — toda acción del
        #     dashboard que escribe pasa por <AccionHospitality>, así que la interfaz no
        #     ofrece un botón que el backend va a rechazar con 403
        run: npx vitest run tests/api-key-scopes.test.ts tests/outgoing-webhook-events-guard.test.ts tests/client-catalog-stubs-guard.test.ts tests/deploy-docker-templates-guard.test.ts tests/deploy-scripts-syntax-guard.test.ts tests/intent-determinista-guard.test.ts tests/moneda-plataforma-guard.test.ts tests/guardia-base-datos-produccion.test.ts tests/hospitality-permissions-guard.test.ts tests/hospitality-ui-permissions-guard.test.ts tests/hospitality-acciones-ui.test.tsx

      - name: Run unit tests
        run: npx vitest run
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/volkern_test
          NEXTAUTH_SECRET: ci-test-secret-unit-tests-2026
          NEXTAUTH_URL: http://localhost:3099
          MASTER_KEY: ci_master_key_unit_tests_32chars
          TENANT_PEPPER: ci_tenant_pepper_unit_tests
          STRIPE_SECRET_KEY: sk_test_dummy_ci
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_dummy_ci
          RESEND_API_KEY: re_dummy_ci
          ADMIN_EMAIL: ci@volkern.app
          FACEBOOK_APP_ID: '000000000000000'
          FACEBOOK_APP_SECRET: dummy_fb_secret
