name: E2E — Reconciliation (API)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: e2e-reconciliation-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: nextjs_space

jobs:
  test:
    name: Reconciliation E2E
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: volkern_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nextjs_space/package-lock.json

      - name: Install dependencies
        working-directory: nextjs_space
        run: npm ci

      - name: Verify Prisma CLI
        working-directory: nextjs_space
        run: npx prisma --version
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/volkern_test

      - name: Generate Prisma client
        working-directory: nextjs_space
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/volkern_test

      - name: Run Prisma migrations
        working-directory: nextjs_space
        run: npx prisma db push --accept-data-loss # db push instead of migrate deploy because migration files contain duplicate CREATE TABLE statements
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/volkern_test

      - name: Backup .env files to prevent Next.js from loading conflicting DATABASE_URL
        working-directory: nextjs_space
        run: |
          if [ -f .env ]; then
            mv .env .env.ci-backup
            echo "Backed up .env → .env.ci-backup"
          fi
          if [ -f .env.local ]; then
            mv .env.local .env.local.ci-backup
            echo "Backed up .env.local → .env.local.ci-backup"
          fi

      - name: Run E2E reconciliation test
        working-directory: nextjs_space
        run: npm run test:e2e:reconciliation
        env:
          PORT: 3099
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/volkern_test
          NEXTAUTH_SECRET: ci-test-secret-e2e-reconciliation-2026
          NEXTAUTH_URL: http://localhost:3099
          # Dummy values — the app has fallbacks, but we set them to
          # prevent warnings and avoid hitting unset-variable code paths
          STRIPE_SECRET_KEY: sk_test_dummy_ci
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_dummy_ci
          MASTER_KEY: ci_master_key_e2e_reconciliation_32chars
          TENANT_PEPPER: ci_tenant_pepper_e2e_reconciliation
          RESEND_API_KEY: re_dummy_ci
          ADMIN_EMAIL: ci@volkern.app
          FACEBOOK_APP_ID: '000000000000000'
          FACEBOOK_APP_SECRET: dummy_fb_secret
